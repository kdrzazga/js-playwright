<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotating CUBE</title>
    <style>
        body {
            margin: 0;
            background-color=black;
            overflow: hidden;
        }
        canvas { display: block; }
    </style>
</head>
<body>

    <div id="slider-container">
        <input type="range" id="speed-vertical" min="0" max="10" value="5" />
        <label for="speed-vertical">Speed vertical</label>
        &nbsp
        <input type="range" id="speed-horizontal" min="0" max="10" value="5" />
        <label for="speed-horizontal">Speed horizontal</label>
		&nbsp
		<button id="change-color">Change Color</button>
		&nbsp
		ZOOM
		&nbsp
		<button id="zoom-in">+</button>
		&nbsp
		<button id="zoom-out">&nbsp-</button>
		&nbsp&nbsp|&nbsp
		<input type="checkbox" id="tunnel-toggle" />
		<label for="tunnel-toggle">Tunnel effect</label>
		<span id="tunnel-suboptions" style="display:none">
			&nbsp
			<input type="checkbox" id="tunnel-inverse" />
			<label for="tunnel-inverse">Inverse</label>
			&nbsp
			<input type="checkbox" id="tunnel-curved" />
			<label for="tunnel-curved">Curved</label>
		</span>
    </div>
    <script src="three.min.js"></script>
    <script src="../common/tunnel3d.js"></script>
    <script src="script.js"></script>
</body>
</html>
